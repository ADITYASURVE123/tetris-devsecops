<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s Tetris | DevSecOps</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>TETRIS <span>on Kubernetes</span></h1>
    <div class="game-area">
      <canvas id="board" width="240" height="400"></canvas>
      <div class="side">
        <h3>Next</h3>
        <canvas id="next" width="80" height="80"></canvas>
        <h3>Score</h3>
        <div id="score">0</div>
        <h3>Lines</h3>
        <div id="lines">0</div>
        <p class="hint">← → move<br>↑ rotate<br>↓ soft drop<br>space hard drop</p>
      </div>
    </div>
    <footer>v1.0 &middot; served from EKS &middot; <span id="pod"></span></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
